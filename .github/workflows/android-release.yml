name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RemodexAndroid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remodex-release.jks"

      - name: Run unit tests and lint
        run: ./gradlew test lintDebug

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/remodex-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature and checksum
        run: |
          $apk = Get-ChildItem app/build/outputs/apk/release/*.apk | Select-Object -First 1
          if (-not $apk) { throw "Release APK was not produced" }
          $buildTools = Join-Path $env:ANDROID_HOME "build-tools"
          $apksigner = Get-ChildItem $buildTools -Recurse -Filter apksigner | Select-Object -First 1
          if (-not $apksigner) { throw "apksigner was not found" }
          & $apksigner.FullName verify --verbose $apk.FullName
          $hash = (Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($apk.Name)" | Out-File "$($apk.FullName).sha256" -Encoding ascii
          Write-Output "SHA-256: $hash"
        shell: pwsh

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: remodex-android-release
          path: |
            RemodexAndroid/app/build/outputs/apk/release/*.apk
            RemodexAndroid/app/build/outputs/apk/release/*.sha256

      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RemodexAndroid/app/build/outputs/apk/release/*.apk
            RemodexAndroid/app/build/outputs/apk/release/*.sha256
